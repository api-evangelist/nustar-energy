aid: nustar-energy
name: NuStar Energy
description: >-
  NuStar Energy was one of the largest independent liquids terminal and pipeline
  operators in the United States, transporting and storing crude oil, refined
  products, and renewable fuels. Sunoco LP completed its acquisition of NuStar on
  3 May 2024, and nustarenergy.com now redirects to sunocolp.com. NuStar published
  no public APIs or developer resources.
